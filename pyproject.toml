[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moss-mini"
version = "0.1.0"
description = "Original MOSS-Image 9B encoder with packed INT6 weights and streamed fused INT8 generation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "torch==2.9.1", "diffusers==0.38.0", "transformers==5.17.0",
  "accelerate>=1.10,<2", "safetensors>=0.6,<1", "numpy>=1.26,<3", "Pillow>=10",
  "huggingface-hub>=1", "comfy-kitchen==0.2.37", "orbitquant==0.14.0",
  "nvidia-cublas==13.0.0.19; platform_system == 'Linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build"]

[project.scripts]
moss-mini = "moss_mini.cli:main"

[tool.setuptools]
packages = ["moss_mini"]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
